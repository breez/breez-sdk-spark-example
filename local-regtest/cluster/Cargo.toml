[package]
name = "glow-regtest"
version = "0.1.0"
edition = "2024"
publish = false

# Pinned: `spark-itest` is the sdk's internal fixture crate, so its surface can
# change on any commit. Bump this deliberately, and keep it on a rev whose
# `crates/spark-itest/docker` still builds the images the fixtures expect.
[dependencies]
spark-itest = { git = "https://github.com/breez/spark-sdk", rev = "efc1f419b5fe2213af51ce88f936e1638f2d3a4a" }
spark-wallet = { git = "https://github.com/breez/spark-sdk", rev = "efc1f419b5fe2213af51ce88f936e1638f2d3a4a" }

anyhow = "1.0.98"
bip39 = "2.2.0"
hex = "0.4.3"
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["full"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
