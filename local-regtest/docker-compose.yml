# A local mempool.space over the Spark regtest cluster's bitcoind, so the app and
# the sdk run the same chain client here as on mainnet. Ports and container names
# are offset from the arkade stack so both can run at once.
#
# Ports come from wire.mjs, which rewrites local-regtest/.env whenever the
# cluster restarts. bitcoind reaches us over the host, not the cluster's docker
# network, whose name changes with every run.
#
# Only electrs is started by default: it is the chain source the app reads.
# The mempool.space explorer is behind the `explorer` profile,
# since nothing in the app needs them.

name: spark-regtest

services:
  spark-electrs:
    image: mempool/electrs:latest
    container_name: spark-electrs
    restart: on-failure
    command:
      - --network=regtest
      - --daemon-dir=/bitcoin
      - --daemon-rpc-addr=${BITCOIND_HOST:-host.docker.internal}:${BITCOIND_RPC_PORT:?set by regtest-wire}
      - --cookie=${BITCOIND_RPC_USER:-rpcuser}:${BITCOIND_RPC_PASSWORD:-rpcpassword}
      - --http-addr=0.0.0.0:3002
      - --electrum-rpc-addr=0.0.0.0:50001
      - --db-dir=/data
      - --cors=*
      - -vv
    volumes:
      - bitcoind_data:/bitcoin:ro
      - spark_electrs_db:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ELECTRS_HTTP_PORT:-3002}:3002"

  spark-mempool-db:
    profiles: ["explorer"]
    image: mariadb:10.5
    container_name: spark-mempool-db
    restart: on-failure
    environment:
      MYSQL_DATABASE: mempool
      MYSQL_USER: mempool
      MYSQL_PASSWORD: mempool
      MYSQL_ROOT_PASSWORD: mempool_root
    volumes:
      - spark_mempool_db:/var/lib/mysql

  spark-mempool-api:
    profiles: ["explorer"]
    image: mempool/backend:v3.3.1
    container_name: spark-mempool-api
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    command: "./wait-for-it.sh spark-mempool-db:3306 --timeout=720 --strict -- ./start.sh"
    depends_on:
      - spark-mempool-db
      - spark-electrs
    environment:
      CORE_RPC_HOST: ${BITCOIND_HOST:-host.docker.internal}
      CORE_RPC_PORT: ${BITCOIND_RPC_PORT:?set by regtest-wire}
      CORE_RPC_USERNAME: ${BITCOIND_RPC_USER:-rpcuser}
      CORE_RPC_PASSWORD: ${BITCOIND_RPC_PASSWORD:-rpcpassword}
      CORE_RPC_TIMEOUT: "120000"
      MEMPOOL_BACKEND: esplora
      ESPLORA_REST_API_URL: http://spark-electrs:3002
      ELECTRUM_HOST: spark-electrs
      ELECTRUM_PORT: "50001"
      ELECTRUM_TLS_ENABLED: "false"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: spark-mempool-db
      DATABASE_PORT: "3306"
      DATABASE_DATABASE: mempool
      DATABASE_USERNAME: mempool
      DATABASE_PASSWORD: mempool
      MEMPOOL_NETWORK: regtest
      MEMPOOL_HTTP_PORT: "8999"
      MEMPOOL_CACHE_DIR: /backend/cache
      MEMPOOL_POLL_RATE_MS: "2000"
      MEMPOOL_INDEXING_BLOCKS_AMOUNT: "-1"
      STATISTICS_ENABLED: "false"
      LIGHTNING_ENABLED: "false"
      NODE_OPTIONS: "--max-old-space-size=2048"
    volumes:
      - spark_mempool_cache:/backend/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MEMPOOL_API_PORT:-8998}:8999"

  spark-mempool-web:
    profiles: ["explorer"]
    image: mempool/frontend:v3.3.1
    container_name: spark-mempool-web
    user: "1000:1000"
    init: true
    restart: on-failure
    command: "./wait-for spark-mempool-api:8999 --timeout=720 -- nginx -g 'daemon off;'"
    depends_on:
      - spark-mempool-api
    environment:
      FRONTEND_HTTP_PORT: "80"
      BACKEND_MAINNET_HTTP_HOST: spark-mempool-api
    ports:
      - "${MEMPOOL_WEB_PORT:-3001}:80"

volumes:
  bitcoind_data:
    external: true
    name: ${BITCOIND_DATA_VOLUME:?set by regtest-wire}
  spark_electrs_db:
  spark_mempool_db:
  spark_mempool_cache:
